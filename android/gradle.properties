android.useAndroidX=true
org.gradle.jvmargs=-Xmx1g -XX:+UseSerialGC -XX:MaxMetaspaceSize=768m
# o daemon se encerra após 1 min parado (padrão: 3 h)
org.gradle.daemon.idletimeout=60000
# Kotlin compila dentro do daemon do Gradle: sem segundo daemon residente
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
kotlin.code.style=official
