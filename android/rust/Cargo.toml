[package]
name = "livescreen-android"
version = "0.5.2"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
livescreen-core = { path = "../../crates/livescreen-core" }
anyhow = "1"
bytes = "1"
iroh = "1.4.1"
jni = "0.21"
ndk-context = "0.1"
serde_json = "1"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
