# Notas de release geradas pelo git-cliff (release.yml) a partir dos Conventional Commits
# entre a tag anterior e a atual. Corpo em lista (`- item`) vira subitens. "What's Changed",
# "New Contributors" e "Full Changelog" vêm do generate_release_notes do GitHub (release.yml).

[changelog]
header = ""
body = """
{%- set repo = "https://github.com/pendiego/LiveScreen" -%}
{%- macro item(c, repo) -%}
* {% if c.scope %}**{{ c.scope }}:** {% endif %}{{ c.message }} ([{{ c.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ c.id }}))
{#- linha não vazia que não começa com "- " ou "* " continua o item de cima: junta antes de dividir -#}
{%- if c.body %}{% set body = c.body | replace_regex(from="\\n[ \\t]*([^-*\\s]|[-*][^ \\t\\n])", to=" ${1}") %}{% for line in body | split(pat="\n") %}{% set l = line | trim %}{% if l is starting_with("- ") or l is starting_with("* ") %}{% set t = l | trim_start_matches(pat="- ") | trim_start_matches(pat="* ") %}
{{ "  - " ~ t }}{% endif %}{% endfor %}{% endif %}
{%- endmacro item -%}

{%- set breaking = commits | filter(attribute="breaking", value=true) %}
{%- if breaking | length > 0 %}
## Breaking Changes
{% for c in breaking -%}
* {{ c.breaking_description | default(value=c.message) }} ([{{ c.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ c.id }}))
{% endfor -%}
{%- endif %}
{#- uma seção por componente (como os pacotes das notas do oh-my-pi), com Added/Changed/Fixed dentro -#}
{%- for comp in ["LiveScreen", "Android"] %}
{%- set_global n = 0 %}
{%- for c in commits %}{% if comp == "Android" and c.scope == "android" or comp != "Android" and c.scope != "android" %}{% set_global n = n + 1 %}{% endif %}{% endfor %}
{%- if n > 0 %}
## {{ comp }}
{%- for group, list in commits | group_by(attribute="group") %}
{%- set_global k = 0 %}
{%- for c in list %}{% if comp == "Android" and c.scope == "android" or comp != "Android" and c.scope != "android" %}{% set_global k = k + 1 %}{% endif %}{% endfor %}
{%- if k > 0 %}
### {{ group | striptags | trim }}
{% for c in list -%}
{%- if comp == "Android" and c.scope == "android" or comp != "Android" and c.scope != "android" -%}
{{ self::item(c=c, repo=repo) }}
{% endif -%}
{%- endfor -%}
{%- endif %}
{%- endfor %}
{%- endif %}
{%- endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^chore\\(merge\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^style", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^revert", group = "<!-- 2 -->Fixed" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^test", group = "<!-- 4 -->Maintenance" },
  { message = "^(ci|build|chore)", group = "<!-- 4 -->Maintenance" },
  { message = ".*", group = "<!-- 5 -->Other Changes" },
]
