name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-linux-android,aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::secret ANDROID_KEYSTORE_B64 ausente"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
      - working-directory: android
        env:
          LIVESCREEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export LIVESCREEN_KEYSTORE="$RUNNER_TEMP/release.jks"
          bash ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../livescreen-android.apk
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk
          path: livescreen-android.apk
  release:
    needs: android
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # o git-cliff precisa do histórico e das tags para achar a tag anterior
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release
      - run: Compress-Archive -Path target/release/livescreen.exe,LICENSE-MIT,LICENSE-APACHE,README.md -DestinationPath livescreen-windows-x64.zip
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: git-cliff@2.14.2
      # notas = todos os Conventional Commits desde a tag anterior (config em cliff.toml);
      # na versão final as betas não contam como tag anterior: as notas vêm desde a última final
      - run: git-cliff --current --strip all --output CHANGES.md
        env:
          GIT_CLIFF_TAG_PATTERN: ${{ contains(github.ref_name, '-') && 'v[0-9].*' || '^v[0-9]+\.[0-9]+\.[0-9]+$' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          # o exe solto só é instalado pelo updater depois que .github/scripts/sign-release.ps1 sobe livescreen.exe.sig;
          # o apk solto é o que o updater do Android baixa (nome fixo em Updater.ASSET)
          files: |
            livescreen-windows-x64.zip
            target/release/livescreen.exe
            livescreen-android.apk
          body_path: CHANGES.md
          # o GitHub acrescenta "What's Changed" (PRs), "New Contributors" e "Full Changelog"
          generate_release_notes: true
          # tags com sufixo (v0.6.0-beta.1) saem como pré-lançamento: o /releases/latest dos updaters as ignora
          prerelease: ${{ contains(github.ref_name, '-') }}
