name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: Compress-Archive -Path target/release/livescreen.exe -DestinationPath livescreen-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: livescreen-windows-x64.zip
          generate_release_notes: true
