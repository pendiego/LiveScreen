[package]
name = "livescreen-core"
version = "0.4.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
bytes = "1"
iroh = "1.4.1"
iroh-tickets = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
